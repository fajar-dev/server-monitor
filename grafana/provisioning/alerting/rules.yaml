# Fires per (job, method, path) when a *-app job logs HTTP 5xx in the last 5 min.
# Grouping by endpoint makes each failing route its own alert instance, so the
# Google Chat message can name exactly which endpoint broke (not just the app).
apiVersion: 1

groups:
  - orgId: 1
    name: app-errors
    folder: Alerts
    interval: 1m
    rules:
      - uid: http-5xx-gchat
        title: HTTP 5xx Errors
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'HTTP 5xx pada {{ $labels.job }} — {{ $labels.method }} {{ $labels.path }}'
          description: '{{ $values.A }} response 5xx dalam 5 menit terakhir.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (job, method, path) (count_over_time({job=~".+-app"} | json | status >= 500 [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
