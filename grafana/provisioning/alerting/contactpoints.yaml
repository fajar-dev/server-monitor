# Google Chat contact point with a custom, informative message.
# The webhook URL is read from the GCHAT_WEBHOOK_URL env var (set in .env), so
# the secret never lives in this file.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: google-chat
    receivers:
      - uid: gchat-webhook
        type: googlechat
        # Only notify on firing (skip "resolved" noise).
        disableResolveMessage: true
        settings:
          url: $__env{GCHAT_WEBHOOK_URL}
          title: '🔴 HTTP 5xx — {{ .CommonLabels.job }}'
          # One block per failing endpoint. Includes a ready-to-paste LogQL query
          # to open the actual error lines + stack trace in Grafana Explore.
          message: |
            {{ range .Alerts }}━━━━━━━━━━━━━━━━━━━━
            App       : {{ .Labels.job }}
            Endpoint  : {{ .Labels.method }} {{ .Labels.path }}
            Jumlah    : {{ .Values.A }} error 5xx (5 menit terakhir)
            Waktu     : {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            Lihat trace : {job="{{ .Labels.job }}"} | json | status>=500 | path="{{ .Labels.path }}"
            {{ end }}
