# Auto-provisioned datasources with STABLE uids so alert rules can reference them.
# If you previously added Prometheus/Loki manually in the UI, delete those manual
# ones to avoid duplicates (the provisioned ones below are the source of truth).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
