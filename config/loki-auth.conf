# nginx reverse proxy that puts HTTP Basic Auth in front of Loki.
# Reads credentials from config/loki.htpasswd (pre-generated from .env — see
# README). Internal clients (Grafana, the local Promtail) still talk to
# loki:3100 directly and bypass this proxy.

upstream loki_upstream {
    server loki:3100;
}

server {
    listen 3100;
    server_name _;

    # Loki pushes can be sizeable; allow larger request bodies.
    client_max_body_size 32m;

    auth_basic "Loki";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://loki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
