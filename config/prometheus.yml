global:
  scrape_interval: 15s

scrape_configs:
  # Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          server: "monitoring-host"

  # PM2 metrics
  - job_name: "pm2-is5x"
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["is5x.nusa.net.id:9209"]
        labels:
          server: "is5x"
