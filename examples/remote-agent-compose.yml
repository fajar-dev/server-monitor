# Contoh setup agent untuk dipasang di SETIAP server yang ingin dipantau
# (bukan di server monitoring). Agent ini mengirim metrik & log ke
# server monitoring (server-monitor), tidak menyimpan apa pun secara lokal.
#
# Cara pakai:
#   1. Salin file ini + remote-promtail-config.yml ke server yang mau dipantau
#   2. Ganti MONITORING_HOST di bawah dengan IP/hostname server monitoring
#   3. Ganti SERVER_NAME sesuai nama server ini (label di Grafana)
#   4. docker compose -f remote-agent-compose.yml up -d

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./remote-promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: always
