# Ganti MONITORING_HOST dengan IP/hostname server monitoring (server-monitor)
# dan SERVER_NAME dengan nama server ini agar mudah difilter di Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://MONITORING_HOST:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: SERVER_NAME
          __path__: /var/lib/docker/containers/*/*.log

  # Tambahkan job lain sesuai aplikasi yang berjalan di server ini, contoh:
  # - job_name: my-app
  #   static_configs:
  #     - targets:
  #         - localhost
  #       labels:
  #         job: my-app
  #         host: SERVER_NAME
  #         __path__: /var/log/my-app/*.log
